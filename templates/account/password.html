{% extends "base.html" %}
{% block title %}{{ _('Trocar senha') }} — Spool Control{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    {% if forced %}
    <div class="alert alert-warning d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-shield-lock-fill"></i>
      <div>{{ _('Por segurança, defina uma senha própria antes de continuar.') }}</div>
    </div>
    {% endif %}
    <div class="card">
      <div class="card-header fw-semibold">{{ _('Trocar senha') }}</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('account_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">{{ _('Senha atual') }}</label>
            <input type="password" name="current_password" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('Nova senha') }}</label>
            <input type="password" name="new_password" class="form-control" required minlength="8">
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('Confirmar nova senha') }}</label>
            <input type="password" name="confirm_password" class="form-control" required minlength="8">
          </div>
          <button type="submit" class="btn btn-dark w-100">{{ _('Salvar nova senha') }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
